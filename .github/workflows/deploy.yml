name: Deploy to EC2 (AWS ECR)

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  CONTAINER_NAME: ecom-admin # Docker container name on EC2
  APP_PORT: 80 # Port nginx listens on inside the container
  HOST_PORT: 4010 # Port exposed on the EC2 host

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build the React/Vite app, push Docker image to ECR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          # These build-args are baked into the static JS bundle at build time
          VITE_APP_BASE_NAME: ${{ secrets.VITE_APP_BASE_NAME }}
          VITE_APP_SERVER_URL: ${{ secrets.VITE_APP_SERVER_URL }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --build-arg VITE_APP_BASE_NAME="$VITE_APP_BASE_NAME" \
            --build-arg VITE_APP_SERVER_URL="$VITE_APP_SERVER_URL" \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SSH into EC2 and deploy the new container
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR (for registry URI)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔒 Prepare runtime secrets
        id: prep
        run: |
          ECR_PASS=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          echo "::add-mask::$ECR_PASS"
          echo "ecr_password=$ECR_PASS" >> "$GITHUB_OUTPUT"

      - name: 🖥️ SSH into EC2 and run container
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.prep.outputs.ecr_password }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          HOST_PORT: ${{ env.HOST_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: IMAGE_URI,ECR_REGISTRY,ECR_PASSWORD,CONTAINER_NAME,APP_PORT,HOST_PORT
          script: |
            set -e

            echo "==> Authenticating Docker with ECR..."
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "==> Pulling image: $IMAGE_URI"
            docker pull "$IMAGE_URI"

            echo "==> Stopping old container (if running)..."
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm   "$CONTAINER_NAME" 2>/dev/null || true

            echo "==> Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$HOST_PORT:$APP_PORT" \
              "$IMAGE_URI"

            echo "==> Pruning dangling images to free disk space..."
            docker image prune -f

            echo "✅ Deployment complete — container: $CONTAINER_NAME"
